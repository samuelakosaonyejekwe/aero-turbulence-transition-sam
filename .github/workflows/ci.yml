name: checks

# The self-checks in this project were three __main__ blocks run by hand.  They
# are worth running, and nothing made anyone run them: a commit that broke the
# march's output contract, or a rename that left a generator reading a column
# that no longer exists, would be found by whoever next spent the best part of
# a quarter of an hour on a full regeneration.  tools/smoke.py finds both in a
# small fraction of that, so it runs on every push.  (No wall-clock figure is
# quoted anywhere here.  They are machine-dependent, and the precise ones this
# comment used to give - seven seconds, four minutes - were both a third of what
# the same work costs now.  tools/pipeline.py writes the measured per-stage
# times to .pipeline/timings.json every run.)
#
# The full regeneration is NOT run here.  It needs the Falkner-Skan families and
# the amplification database, which take minutes and hours respectively to
# build, and it writes 50-odd figures; that belongs on the machine the results
# are published from, not in CI.  What CI guards is that the code still holds
# together and that the committed CSVs still say what the committed document
# says.

# Action versions.  GitHub deprecated Node 20 on its runners, and checkout@v4,
# setup-python@v5 and cache@v4 target it - they were being force-run on Node 24
# with a warning on every job.  These are the current majors and each declares
# `using: node24` in its own action.yml, which was checked rather than assumed.
# Bumping a major can change an action's defaults, so the run after this one is
# the check: if the cache key still hits and the pinned environment still
# installs, the bump is clean.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache the Falkner-Skan families
        # Deterministic functions of the source, so they are keyed on it.  The
        # amplification database is committed; these two are not, because they
        # rebuild quickly - but not on every job if we can help it.
        uses: actions/cache@v6
        with:
          path: |
            solver/falkner_skan_family.npz
            solver/falkner_skan_reverse.npz
          key: fs-family-${{ hashFiles('solver/stability.py') }}

      - name: Solver and stability self-tests
        run: |
          python solver/stability.py
          python solver/utss_solver.py

      - name: Smoke checks
        run: python tools/smoke.py

      - name: Report agrees with the CSVs
        # The committed PDF against the committed CSVs.  This is what catches a
        # number edited in one place and not the other.
        run: python verify_outputs.py

      - name: Generators still run
        # Cheap stages only - geometry, equations and the model setup - which
        # between them import every module and exercise the writers without
        # spending the several minutes the validation sweep costs.
        run: |
          python tools/pipeline.py --no-smoke --jobs 2 \
            --stages geometry,equations,mesh

      - name: Data outputs regenerate identically
        # The numbers THESE STAGES OWN must reproduce, and on a clean runner
        # with a fresh install of the pinned environment they do, bit for bit.
        # That is thirteen of the sixty-two tracked CSVs - 01_geometry, 02_mesh,
        # 03_model_setup and 07_equations - because the step above runs the
        # cheap stages only; 04_solution and 06_validation need the solve and
        # the validation sweep, which belong on the machine the results are
        # published from.  The `git diff` below is over ALL CSVs, so it would
        # also fail on a committed 04_solution or 06_validation file that
        # disagrees with the checkout, but nothing here regenerates those.
        #
        # This is the check that would have caught the CSVs being written at
        # full float64, whose last bits moved with the BLAS thread count and
        # made every regeneration a new blob.
        #
        # Rendered images are deliberately NOT compared.  matplotlib output is
        # not byte-reproducible across machines - font rasterisation depends on
        # the freetype build and on which fonts are installed - so diffing PNGs
        # here tests the runner, not the code.  The first version of this step
        # did compare them and failed on nine drawings whose data was identical.
        # The figure diff is still printed, because a figure that changes SHAPE
        # is worth seeing; it just does not fail the build.
        run: |
          echo "--- data files ---"
          git diff --stat -- '*.csv'
          git diff --quiet -- '*.csv' || {
            echo "::error::a generator did not reproduce its committed CSVs"
            exit 1
          }
          echo "--- rendered figures (informational; see the comment above) ---"
          git diff --stat -- '*.png' | tail -3
